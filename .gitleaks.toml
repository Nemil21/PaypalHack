# HF-047 secret scan config: gitleaks' default rules, plus path-scoped allowlists for test
# fixtures that only look like keys. Path allowlists survive rebases; .gitleaksignore pins
# (commit:file:rule:line) do not, because every rebase gives the commits new SHAs.
#   npm run security:secrets   (scripts/secret-scan.sh passes --config .gitleaks.toml)

[extend]
useDefault = true

# HF-054b: placeholder Web Push subscription keys (`p256dh` public key + `auth`) for fake
# devices on random-UUID endpoints. Browser-side subscription values, not server credentials.
# Scoped to these two test files only; nothing else is allowlisted.
[[allowlists]]
description = "HF-054b fake push-subscription keys in tests"
paths = [
  '''^apps/api/src/routes/notifications-push\.test\.ts$''',
  '''^packages/core/src/notifications/fanout\.test\.ts$''',
]
