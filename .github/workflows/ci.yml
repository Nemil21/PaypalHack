name: ci

# Whole-repo check on every PR and every push to main (no path filter), so lockfile drift or a
# break in any workspace is caught. db.yml stays as HF-002's schema-focused workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate an empty database twice (idempotent)
        run: npm run migrate && npm run migrate
      - name: Postgres constraint tests
        run: npm run test:db
      - name: Money primitives integration tests (HF-003a races on Postgres)
        run: npx vitest run packages/core/src/money
      - name: Clear transaction integration + race tests (HF-027)
        run: npx vitest run packages/core/src/listings apps/api/src/routes/clear.test.ts apps/api/src/routes/listings-cancel.test.ts
      - name: Console slider vs /simulate parity on Postgres (HF-024)
        run: npx vitest run apps/api/src/routes/slider-parity.test.ts
      - name: Bid service integration + race tests on the FakePayPal stub (HF-014a)
        run: npx vitest run packages/core/src/bids.test.ts apps/api/src/routes/bids.test.ts
      - name: SSE event bus integration tests (HF-008, incl. a second API process)
        run: npx vitest run apps/api/src/events
      - name: Admin brand verification + publish guard, brand overview integration tests (HF-011a, HF-026)
        run: npx vitest run packages/core/src/brands apps/api/src/routes/admin-brands.test.ts apps/api/src/routes/brand-overview.test.ts
      - name: Channel3 products repo + search proxy on Postgres (HF-009, fixtures)
        run: npx vitest run packages/core/src/channel3 apps/api/src/routes/products.test.ts
      - name: Settlement + promotion integration and race tests on the FakePayPal stub (HF-029, HF-030a, HF-031)
        run: npx vitest run --maxWorkers=2 packages/core/src/settlement
      - name: My bids, cancel and release-if-cheaper integration + race tests (HF-016, HF-020)
        run: npx vitest run packages/core/src/bid-cancel.test.ts packages/core/src/bid-price-watch.test.ts apps/api/src/routes/my-bids.test.ts
      - name: Buyer rounds nudge → poll → raise integration on the FakePayPal stub (HF-038a)
        run: npx vitest run packages/core/src/rounds/buyer-rounds.test.ts
      - name: MCP tokens, /mcp auth, scopes, rate limit and revoke race (HF-043)
        run: npx vitest run apps/api/src/routes/mcp-clients.test.ts
      - name: Brand payout integration + race tests on the FakePayPal stub (HF-032)
        run: npx vitest run --maxWorkers=2 packages/core/src/payouts apps/api/src/routes/payout-retry.test.ts
