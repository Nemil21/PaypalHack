# Holdfast on Render (HF-048a). Setup and manual steps: docs/deploy/render.md.
# Schema: https://render.com/schema/render.yaml.json
#
# Rules this file encodes:
# - Paid instances only (free web services sleep; free Postgres expires before judging ends Dec 21).
# - One web instance: in-process jobs and rate limits assume a single process.
# - Migrations only on deploy (preDeployCommand). Never seed on deploy: seeding is manual or the
#   HF-048b `demo:refresh` cron.
# - Secrets are `sync: false`: Render prompts for them when the Blueprint is first applied and
#   never reads them from this file. Env groups cannot hold prompted values, so the group below
#   carries non-secret flags only.

envVarGroups:
  - name: holdfast-config
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_MODE
        value: sandbox
      # In-process settlement until HF-030b's Render smoke is green (D9 / M17); then `workflows`.
      - key: SETTLEMENT_RUNNER
        value: inprocess
      # Judges get the one-click demo sign-ins (HF-006, D13).
      - key: DEMO_MODE
        value: 'true'
      - key: RENDER_WORKFLOW_SLUG
        value: holdfast-workflows

databases:
  - name: holdfast-db
    databaseName: holdfast
    user: holdfast
    region: oregon
    # Paid: the free instance expires ~30 days after creation, before judging ends.
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: '16'
    # Private network only. Add a teammate's IP in the dashboard for psql access when needed.
    ipAllowList: []

services:
  - type: web
    name: holdfast
    runtime: node
    region: oregon
    plan: starter
    numInstances: 1
    # NODE_ENV=production is set at build time too, so ask npm for devDependencies (tsc, vite).
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    # HF-048b turns this off from 21:00 PST Nov 11 through recording, and after submission.
    autoDeployTrigger: commit
    envVars:
      - fromGroup: holdfast-config
      - key: DATABASE_URL
        fromDatabase:
          name: holdfast-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BRAND_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: AG_GRID_LICENSE_KEY
        sync: false
      # Account API key that triggers workflow tasks (Account Settings > API Keys).
      - key: RENDER_API_KEY
        sync: false

  # Render Workflows: the hello-world task (HF-048a) and the settlement tasks `settleListing` /
  # `settleBid` (HF-030b). Compute plan, retries (0) and timeouts are set per task in
  # apps/workflows/src/tasks.ts. The settlement tasks load the same config as the web service.
  - type: workflow
    name: holdfast-workflows
    runtime: node
    region: oregon
    buildCommand: npm ci --include=dev && npm run build -w @holdfast/shared -w @holdfast/core -w @holdfast/workflows
    startCommand: node apps/workflows/dist/main.js
    autoDeployTrigger: commit
    envVars:
      - fromGroup: holdfast-config
      - key: DATABASE_URL
        fromDatabase:
          name: holdfast-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # loadConfig requires it; the workflow service never signs sessions.
      - key: SESSION_SECRET
        generateValue: true
      # The 1-decline run needs PayPal-Mock-Response on the capture (sandbox + DEMO_MODE + this).
      - key: ALLOW_MOCK_DECLINE
        sync: false
